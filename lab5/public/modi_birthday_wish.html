<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday Narendra Modi Ji</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    /* Navbar */
    nav {
      height: 65px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8%;
      border-bottom: 3px solid #ff9933;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }

    nav a {
      text-decoration: none;
      color: #333;
      font-weight: 600;
    }

    nav a:hover {
      color: #ff6600;
    }

    /* Home */
    .home {
      min-height: calc(100vh - 65px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 8%;
    }

    .home-content {
      max-width: 1100px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 60px;
    }

    .text {
      flex: 1;
    }

    .text h1 {
      font-size: 52px;
      margin-bottom: 15px;
    }

    .orange {
      color: #ff7700;
    }

    .green {
      color: #138808;
    }

    .text h2 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .text p {
      font-size: 18px;
      line-height: 1.6;
      color: #555;
      max-width: 600px;
    }

    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 25px;
      background: #ff7700;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }

    .btn:hover {
      background: #e65f00;
    }

    /* Image */
    .image {
      flex: 0 0 350px;
    }

    .image img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 18px;
      background: #222;
      color: white;
      font-size: 14px;
    }

    /* Mobile */
    @media (max-width: 768px) {

      nav {
        padding: 0 5%;
      }

      .home {
        padding: 40px 5%;
      }

      .home-content {
        flex-direction: column;
        text-align: center;
      }

      .text h1 {
        font-size: 38px;
      }

      .text h2 {
        font-size: 23px;
      }

      .text p {
        font-size: 16px;
      }

      .image {
        flex: none;
        width: 280px;
      }
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav>
    <div class="logo">Birthday Tribute</div>

    <a href="#home">Home</a>
  </nav>


  <!-- Home -->
  <section class="home" id="home">

    <div class="home-content">

      <div class="text">

        <h1>
          Happy Birthday
          <span class="orange">Narendra</span>
          <span class="green">Modi Ji</span>
        </h1>

        <h2>Celebrating 76 Years</h2>

        <p>
          Wishing Shri Narendra Modi Ji a very happy birthday
          and good health. May the journey ahead continue to
          bring progress, development and new opportunities
          for India.
        </p>

        <a href="#" class="btn">
          Send Birthday Wishes
        </a>

      </div>


      <div class="image">

        <img
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Prime_Minister_Narendra_Modi_in_New_Delhi_on_February_17%2C_2025.jpg/800px-Prime_Minister_Narendra_Modi_in_New_Delhi_on_February_17%2C_2025.jpg"
          alt="Narendra Modi">

      </div>

    </div>

  </section>


  <footer>
    © 2026 Birthday Tribute
  </footer>

</body>

</html>
